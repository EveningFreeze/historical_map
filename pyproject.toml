[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-map-platform"
version = "0.1.0"
description = "Desktop platform for historical-map place-name extraction"
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15,<6",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "shapely>=2,<3",
]

[tool.setuptools]
packages = ["app"]
